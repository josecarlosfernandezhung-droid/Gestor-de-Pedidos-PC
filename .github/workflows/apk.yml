name: Construir APK Vendedor
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar la app del vendedor
        run: |
          python3 build_www.py
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/filesystem@6 @capacitor/share@6 @capacitor-mlkit/barcode-scanning@6
          # Avisos nativos: si no se puede instalar, la APK se arma igual (sin esa funcion)
          npm install @capacitor/local-notifications@6 || echo "AVISO: sin local-notifications"
          
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.totools.vendedor","appName":"Toto Vendedor","webDir":"www",
           "server":{"androidScheme":"http","cleartext":true},
           "android":{"allowMixedContent":true,"backgroundColor":"#00000000"}}
          JSON
          
          # PRIMERO se genera la plataforma Android para que existan las rutas y archivos
          npx cap add android
          
          # AHORA SÍ se pueden modificar con sed los archivos recién creados
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          
          # Permisos del segundo plano y avisos
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          for perm in ['POST_NOTIFICATIONS', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_DATA_SYNC', 'FOREGROUND_SERVICE_SPECIAL_USE', 'WAKE_LOCK', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS', 'VIBRATE']:
              if 'android.permission.' + perm not in s:
                  s = s.replace('<application', '<uses-permission android:name="android.permission.' + perm + '" />\n    <application', 1)
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.CAMERA" />\n    <application', 1)
          if 'TotoBgService' not in s:
              servicio = ('\n        <service android:name=".TotoBgService" android:exported="false" android:foregroundServiceType="specialUse">'
                          '\n            <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Mantiene la conexion con la caja para recibir pedidos y avisos"/>'
                          '\n        </service>\n    ')
              s = s.replace('</application>', servicio + '</application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          # Escaner de Google (Code Scanner), el mismo que usan otras apps: se llama directo desde el plugin TotoBg
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"\n    implementation "com.google.mlkit:barcode-scanning-common:17.0.0"/' android/app/build.gradle
          grep -n "play-services-code-scanner" android/app/build.gradle || { echo "ERROR: no se pudo agregar el escaner de Google"; exit 1; }
          # Plugin propio de segundo plano (servicio en primer plano + wakelock + WebView despierto)
          mkdir -p android/app/src/main/java/com/totools/vendedor
          cat > android/app/src/main/java/com/totools/vendedor/TotoBgService.java <<'JAVA'
          package com.totools.vendedor;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class TotoBgService extends Service {
              static final String CANAL = "toto_segundo_plano";
              static final int ID = 7731;
              private PowerManager.WakeLock wl;
              private WifiManager.WifiLock wifi;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String titulo = "Toto Tools";
                  String texto = "Esperando pedidos y avisos de la caja";
                  if (intent != null) {
                      if (intent.getStringExtra("title") != null) titulo = intent.getStringExtra("title");
                      if (intent.getStringExtra("text") != null) texto = intent.getStringExtra("text");
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel c = new NotificationChannel(CANAL, "Toto Tools en segundo plano", NotificationManager.IMPORTANCE_LOW);
                          c.setDescription("Mantiene la app despierta para recibir pedidos");
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          if (nm != null) nm.createNotificationChannel(c);
                      }
                      Intent abrir = getPackageManager().getLaunchIntentForPackage(getPackageName());
                      PendingIntent pi = PendingIntent.getActivity(this, 0, abrir, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification n = new NotificationCompat.Builder(this, CANAL)
                          .setContentTitle(titulo)
                          .setContentText(texto)
                          .setSmallIcon(android.R.drawable.stat_notify_sync)
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .setCategory(NotificationCompat.CATEGORY_SERVICE)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .build();
                      if (Build.VERSION.SDK_INT >= 34) {
                          startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                      } else {
                          startForeground(ID, n);
                      }
                  } catch (Throwable t) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (wl == null && pm != null) {
                          wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TotoTools:bg");
                          wl.setReferenceCounted(false);
                      }
                      if (wl != null && !wl.isHeld()) wl.acquire();
                  } catch (Throwable t) { }
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(WIFI_SERVICE);
                      if (wifi == null && wm != null) {
                          wifi = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "TotoTools:wifi");
                          wifi.setReferenceCounted(false);
                      }
                      if (wifi != null && !wifi.isHeld()) wifi.acquire();
                  } catch (Throwable t) { }
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  try { if (wl != null && wl.isHeld()) wl.release(); } catch (Throwable t) { }
                  try { if (wifi != null && wifi.isHeld()) wifi.release(); } catch (Throwable t) { }
                  super.onDestroy();
              }
          }
          JAVA
          cat > android/app/src/main/java/com/totools/vendedor/TotoBgPlugin.java <<'JAVA'
          package com.totools.vendedor;

          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.webkit.WebView;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.mlkit.vision.barcode.common.Barcode;
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanner;
          import com.google.mlkit.vision.codescanner.GmsBarcodeScannerOptions;
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning;

          @CapacitorPlugin(name = "TotoBg")
          public class TotoBgPlugin extends Plugin {
              private final Handler h = new Handler(Looper.getMainLooper());
              private boolean activo = false;
              private boolean enSegundoPlano = false;

              // Mientras la app esta en segundo plano, mantiene el WebView "visible" para que Android
              // no le congele los temporizadores (asi sigue consultando pedidos con la pantalla apagada).
              private final Runnable mantener = new Runnable() {
                  @Override
                  public void run() {
                      if (!activo || !enSegundoPlano) return;
                      try {
                          WebView w = getBridge().getWebView();
                          w.resumeTimers();
                          w.onResume();
                          w.dispatchWindowVisibilityChanged(View.VISIBLE);
                      } catch (Throwable t) { }
                      h.postDelayed(this, 8000);
                  }
              };

              @Override
              protected void handleOnPause() {
                  enSegundoPlano = true;
                  if (activo) { h.removeCallbacks(mantener); h.postDelayed(mantener, 500); }
              }

              @Override
              protected void handleOnResume() {
                  enSegundoPlano = false;
                  h.removeCallbacks(mantener);
              }

              @PluginMethod
              public void start(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), TotoBgService.class);
                      i.putExtra("title", call.getString("title", "Toto Tools"));
                      i.putExtra("text", call.getString("text", "Esperando pedidos y avisos de la caja"));
                      ContextCompat.startForegroundService(getContext(), i);
                      activo = true;
                      JSObject r = new JSObject();
                      r.put("active", true);
                      call.resolve(r);
                  } catch (Throwable t) {
                      call.reject("No se pudo iniciar el servicio: " + t.getMessage());
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  activo = false;
                  h.removeCallbacks(mantener);
                  try { getContext().stopService(new Intent(getContext(), TotoBgService.class)); } catch (Throwable t) { }
                  call.resolve();
              }

              @PluginMethod
              public void isIgnoringBattery(PluginCall call) {
                  boolean ok = false;
                  try {
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      ok = pm != null && pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
                  } catch (Throwable t) { }
                  JSObject r = new JSObject();
                  r.put("ignoring", ok);
                  call.resolve(r);
              }

              @PluginMethod
              public void ignoreBattery(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Throwable t) {
                      try {
                          Intent i2 = new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS);
                          i2.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i2);
                      } catch (Throwable t2) { }
                  }
                  call.resolve();
              }

              // Escaner de Google (Google Code Scanner): se abre directo, Google se encarga de todo.
              @PluginMethod
              public void scan(final PluginCall call) {
                  try {
                      GmsBarcodeScannerOptions opts = new GmsBarcodeScannerOptions.Builder()
                          .setBarcodeFormats(Barcode.FORMAT_ALL_FORMATS)
                          .enableAutoZoom()
                          .build();
                      GmsBarcodeScanner sc = GmsBarcodeScanning.getClient(getActivity(), opts);
                      sc.startScan()
                          .addOnSuccessListener(b -> {
                              JSObject r = new JSObject();
                              String v = b.getRawValue();
                              r.put("value", v == null ? "" : v);
                              r.put("cancelled", false);
                              call.resolve(r);
                          })
                          .addOnCanceledListener(() -> {
                              JSObject r = new JSObject();
                              r.put("cancelled", true);
                              call.resolve(r);
                          })
                          .addOnFailureListener(e -> call.reject(String.valueOf(e.getMessage())));
                  } catch (Throwable t) {
                      call.reject("No se pudo abrir el escaner: " + t.getMessage());
                  }
              }
          }
          JAVA
          cat > android/app/src/main/java/com/totools/vendedor/MainActivity.java <<'JAVA'
          package com.totools.vendedor;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TotoBgPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          npx cap sync android
          echo "=== Plugins registrados ==="
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q "BarcodeScanner" android/app/src/main/assets/capacitor.plugins.json || { echo "ERROR: el plugin del escaner no quedo instalado"; exit 1; }
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          src = Image.open('icono_512.png').convert('RGBA')
          # icono clasico (Android < 8) y redondo
          for carpeta, px in (('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)):
              d = os.path.join(res, 'mipmap-' + carpeta); os.makedirs(d, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              im.save(os.path.join(d, 'ic_launcher.png'))
              im.save(os.path.join(d, 'ic_launcher_round.png'))
          # icono adaptable (Android 8+): capa frontal con la P en la zona segura + fondo azul
          fg = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          letra = src.crop((72, 72, 440, 440)).resize((338, 338), Image.LANCZOS)
          fg.paste(letra, (87, 87))
          for carpeta, px in (('mdpi',108),('hdpi',162),('xhdpi',216),('xxhdpi',324),('xxxhdpi',432)):
              d = os.path.join(res, 'mipmap-' + carpeta)
              fg.resize((px, px), Image.LANCZOS).save(os.path.join(d, 'ic_launcher_foreground.png'))
          os.makedirs(os.path.join(res, 'mipmap-anydpi-v26'), exist_ok=True)
          for nombre in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(os.path.join(res, 'mipmap-anydpi-v26', nombre), 'w').write(
                  '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '  <background android:drawable="@color/ic_launcher_background"/>\n'
                  '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          os.makedirs(os.path.join(res, 'values'), exist_ok=True)
          open(os.path.join(res, 'values', 'ic_launcher_background.xml'), 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E293B</color>\n</resources>\n')
          PY
      - name: Compilar y firmar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $BT/zipalign -p -f 4 "$APK" ../alineado.apk
          $BT/apksigner sign --ks ../toto-vendedor.jks --ks-pass pass:tototools2026 --key-pass pass:tototools2026 --out ../Toto-Vendedor.apk ../alineado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Toto-Vendedor-apk
          path: Toto-Vendedor.apk
