name: Construir APK Vendedor
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar la app del vendedor
        run: |
          python3 build_www.py
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/filesystem@6 @capacitor/share@6 @capacitor-mlkit/barcode-scanning@6
          # Avisos nativos y segundo plano: si alguno no se puede instalar, la APK se arma igual (sin esa funcion)
          npm install @capacitor/local-notifications@6 || echo "AVISO: sin local-notifications"
          npm install @anuradev/capacitor-background-mode@6 || echo "AVISO: sin background-mode"
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.totools.vendedor","appName":"Toto Vendedor","webDir":"www",
           "server":{"androidScheme":"http","cleartext":true},
           "android":{"allowMixedContent":true}}
          JSON
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          # ML Kit (escaner nativo) necesita minSdk 23
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle
          # Permiso de CAMARA (foto/escaner del codigo de barras) + modulo del escaner de Google
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          for perm in ['POST_NOTIFICATIONS', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_DATA_SYNC', 'WAKE_LOCK', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS', 'VIBRATE']:
              if 'android.permission.' + perm not in s:
                  s = s.replace('<application', '<uses-permission android:name="android.permission.' + perm + '" />\n    <application', 1)
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application', 1)
          if 'com.google.mlkit.vision.DEPENDENCIES' not in s:
              i = s.index('<application')
              j = s.index('>', i) + 1
              s = s[:j] + '\n        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>' + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          npx cap sync android
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          src = Image.open('icono_512.png').convert('RGBA')
          # icono clasico (Android < 8) y redondo
          for carpeta, px in (('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)):
              d = os.path.join(res, 'mipmap-' + carpeta); os.makedirs(d, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              im.save(os.path.join(d, 'ic_launcher.png'))
              im.save(os.path.join(d, 'ic_launcher_round.png'))
          # icono adaptable (Android 8+): capa frontal con la P en la zona segura + fondo azul
          fg = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          letra = src.crop((72, 72, 440, 440)).resize((338, 338), Image.LANCZOS)
          fg.paste(letra, (87, 87))
          for carpeta, px in (('mdpi',108),('hdpi',162),('xhdpi',216),('xxhdpi',324),('xxxhdpi',432)):
              d = os.path.join(res, 'mipmap-' + carpeta)
              fg.resize((px, px), Image.LANCZOS).save(os.path.join(d, 'ic_launcher_foreground.png'))
          os.makedirs(os.path.join(res, 'mipmap-anydpi-v26'), exist_ok=True)
          for nombre in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              open(os.path.join(res, 'mipmap-anydpi-v26', nombre), 'w').write(
                  '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '  <background android:drawable="@color/ic_launcher_background"/>\n'
                  '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n')
          os.makedirs(os.path.join(res, 'values'), exist_ok=True)
          open(os.path.join(res, 'values', 'ic_launcher_background.xml'), 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1E293B</color>\n</resources>\n')
          PY
      - name: Compilar y firmar
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $BT/zipalign -p -f 4 "$APK" ../alineado.apk
          $BT/apksigner sign --ks ../toto-vendedor.jks --ks-pass pass:tototools2026 --key-pass pass:tototools2026 --out ../Toto-Vendedor.apk ../alineado.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Toto-Vendedor-apk
          path: Toto-Vendedor.apk
