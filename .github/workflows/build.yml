name: Construir ServidorPedidos.exe
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir el .exe
        shell: powershell
        run: ./construir.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ServidorPedidos-exe
          path: dist/ServidorPedidos.exe
